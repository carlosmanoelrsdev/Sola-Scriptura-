spring.application.name=solascriptura

server.port=${BACKEND_PORT:8080}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/solascriptura}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

app.security.jwt.secret=${JWT_SECRET:change-me-in-env}
app.security.jwt.expiration=${JWT_EXPIRATION:3600000}

app.bible.api.url=${BIBLIA_API_URL:https://bibliaapi.com.br}
app.bible.api.key=${BIBLIA_API_KEY:}
